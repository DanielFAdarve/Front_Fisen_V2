<div class="contenedor">
  <h2>📅 Citas</h2>

  <div class="acciones-bar">

    <button mat-raised-button color="primary" (click)="nuevaCita()">
      ➕ Nueva Cita
    </button>

    <!-- Filtro general -->
    <input matInput placeholder="🔍 Buscar" [value]="filtro()" (input)="onFiltroTexto($event)" />

    <!-- Filtro por fecha -->
    <input type="date" matInput (change)="onFechaChange($event)" />

    <!-- Filtro por profesional -->
    <select matInput (change)="onProfesionalChange($event)">
      <option value="">Todos los profesionales</option>
      <option *ngFor="let p of professionals()" [value]="p.id">
        {{ p.nombre }}
      </option>
    </select>

  </div>
