<div class="viewer-header">
  <h2>📄 Documento de historia clínica</h2>
  <button type="button" class="close-btn" (click)="close()">✖</button>
</div>


<div class="viewer-body">
  <ng-container *ngIf="isPdf; else noPreview">
    <iframe #docFrame [src]="safeFileUrl"></iframe>
  </ng-container>

  <ng-template #noPreview>
    <p class="hint">
      Este archivo es .docx y no puede visualizarse directamente. Descárgalo o expórtalo a PDF.
    </p>
  </ng-template>
</div>

<div class="viewer-actions">
  <button type="button" class="secondary" (click)="downloadDocx()">⬇ Descargar archivo</button>
  <button type="button" class="primary" (click)="exportPdf()">🖨 Exportar / Imprimir PDF</button>
</div>
