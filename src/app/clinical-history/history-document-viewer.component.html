<div class="viewer-header">
  <h2>📄 Documento de historia clínica</h2>
  <button type="button" class="close-btn" (click)="close()">✖</button>
</div>

<div class="viewer-body">
  <p class="hint" *ngIf="isPdf; else docxHint">Vista previa en PDF del documento generado por backend.</p>
  <ng-template #docxHint>
    <p class="hint">No fue posible convertir a PDF. Puedes descargar el archivo .docx.</p>
  </ng-template>

  <iframe #docFrame [src]="safeFileUrl" title="Vista previa documento"></iframe>
</div>

<div class="viewer-actions">
  <button type="button" class="secondary" (click)="downloadFile()">⬇ Descargar archivo</button>
  <button type="button" class="primary" (click)="exportPdf()">🖨 Exportar / Imprimir PDF</button>
</div>
