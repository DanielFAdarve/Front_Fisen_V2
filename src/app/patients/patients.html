<div class="page centered">
  <div class="page-inner">
    <div class="contenedor">

      <h2>📋 Pacientes</h2>

      <div class="acciones-bar">
        <button mat-raised-button color="primary" (click)="nuevoPaciente()">
          ➕ Nuevo Paciente
        </button>

        <input
          type="text"
          placeholder="🔍 Buscar"
          [value]="filtro()"
          (input)="filtro.set($any($event.target).value)"
          class="input-filtro"
        />
      </div>

      <!-- Shared Table -->
      <app-shared-table
        [dataSource]="filteredPatients()"
        [displayedColumns]="displayedColumns"
        [loading]="loading()"
        [errorMessage]="errorMessage() ?? ''"

        (edit)="editarPaciente($event)"
        (view)="seleccionar($event)"
        (delete)="eliminar($event)"
      >
      </app-shared-table>

    </div>
  </div>
</div>
