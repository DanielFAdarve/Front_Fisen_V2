<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <mat-icon class="header-icon">home</mat-icon>
  </div>
  <!-- Menú -->
  <nav class="menu">
    <ul>
      <li *ngFor="let item of menuItems">

        <!-- 🔹 Ítem con submenu -->
        <ng-container *ngIf="item.children?.length; else singleItem">

          <!-- Botón del padre -->
          <button class="submenu-btn" (click)="toggleSub(item.label)">
            <span class="label" *ngIf="!isCollapsed">{{ item.label }}</span>
          </button>

          <!-- Submenu -->
          <ul class="submenu" *ngIf="openSubmenu() === item.label && !isCollapsed">
            <li *ngFor="let child of item.children">
              <a [routerLink]="child.route" routerLinkActive="active">
                {{ child.label }}
              </a>
            </li>
          </ul>

        </ng-container>

        <!-- 🔹 Ítem normal -->
        <ng-template #singleItem>
          <a [routerLink]="item.route" routerLinkActive="active">
            <span class="label" *ngIf="!isCollapsed">{{ item.label }}</span>
          </a>
        </ng-template>

      </li>
    </ul>
  </nav>

  <!-- Separador flexible para empujar todo hacia arriba -->
  <div class="spacer"></div>

  <!-- Footer con logo + nombre + soporte -->
  <div class="sidebar-footer">

    <div class="footer-logo">
      <img src="/assets/logo_700.webp" class="logo" />
      <span class="brand" *ngIf="!isCollapsed">Fisen</span>
    </div>

    <div class="footer-links" *ngIf="!isCollapsed">
      <a href="mailto:soporte@fisen.com" class="help-link">
        Mesa de ayuda
      </a>

      <small class="copy">
        © 2025 Fisen
      </small>
    </div>

  </div>

</aside>
