<div class="tabla-container">
  <div *ngIf="loading">⏳ Cargando...</div>
  <div *ngIf="errorMessage">{{ errorMessage }}</div>

  <table mat-table [dataSource]="dataSource">

    <!-- Columnas dinámicas -->
    <ng-container *ngFor="let col of displayedColumns" [matColumnDef]="col">
      <th mat-header-cell *matHeaderCellDef>{{ col }}</th>
      <td mat-cell *matCellDef="let row">{{ row[col] }}</td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button (click)="onView(row)">
          <mat-icon>visibility</mat-icon>
        </button>

        <button mat-icon-button (click)="onEdit(row)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="onDelete(row.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <!-- 
    <ng-container matColumnDef="pagar">
      <th mat-header-cell *matHeaderCellDef>Pagar</th>

      <td mat-cell *matCellDef="let row">
        <ng-container *ngIf="!row.pagado; else yaPagado">
          <button class="pay-btn" (click)="pay.emit(row)">
            <mat-icon>payments</mat-icon>
            Pagar
          </button>
        </ng-container>

        <ng-template #yaPagado>
          <span class="badge paid">Pagado</span>
        </ng-template>
      </td>
    </ng-container> -->
    <ng-container *ngIf="showPayColumn" matColumnDef="pagar">
      <th mat-header-cell *matHeaderCellDef>Pagar</th>
      <td mat-cell *matCellDef="let row">
        <ng-container *ngIf="!row.pagado; else yaPagado">
          <button class="pay-btn" (click)="pay.emit(row)">
            <mat-icon>payments</mat-icon>
            Pagar
          </button>
        </ng-container>

        <ng-template #yaPagado>
          <span class="badge paid">Pagado</span>
        </ng-template>
      </td>
    </ng-container>

    <!-- <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(['acciones'])"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns.concat(['acciones']);"></tr> -->
    <!-- <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(['acciones','pagar'])"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns.concat(['acciones','pagar']);"></tr> -->
    <tr mat-header-row *matHeaderRowDef="finalColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: finalColumns"></tr>

  </table>
</div>
